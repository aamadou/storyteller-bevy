[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"

[target.'cfg(not(target_family = "wasm"))'.dependencies.bevy]
workspace = true
features = ["dynamic_linking"]

# FIXME: Profiles for the non-root package are ignored, but [target] keys are
# not allowed in the root package >_<
# [target.'cfg(target_family = "wasm")'.profile.release]
# opt-level = "z"
