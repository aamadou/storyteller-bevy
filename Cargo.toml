[workspace]
resolver = "2"
members = [
    "./studio"
]

[workspace.dependencies.bevy]
version = "0.11.2"
default-features = false
# TODO: Narrow this down to the features we actually need
# FIXME: WebGPU is sparsely supported, but using the default WebGL backend
#       causes a panic upstream: "Tex storage 2D multisample is not supported"
features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_gilrs",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "png",
    "hdr",
    "ktx2",
    "zstd",
    "vorbis",
    "x11",
    "filesystem_watcher",
    "bevy_gizmos",
    "android_shared_stdcxx",
    "tonemapping_luts",
    "default_font",
]

[profile.dev-custom]
inherits = "dev"
opt-level = 1

[profile.dev-custom.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
