[package]
name = "studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "studio-standalone"
path = "src/main.rs"

[dependencies]
wasm-bindgen = { version = "0.2.84" }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
wasm = ["dep:console_error_panic_hook"]

[dependencies.bevy]
workspace = true
default-features = false
# TODO: Narrow this down to the features we actually need
# FIXME: WebGPU is sparsely supported, but using the default WebGL backend
#       causes a panic upstream: "Tex storage 2D multisample is not supported"
features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_gilrs",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "png",
    "hdr",
    "ktx2",
    "zstd",
    "vorbis",
    "x11",
    "filesystem_watcher",
    "bevy_gizmos",
    "android_shared_stdcxx",
    "tonemapping_luts",
    "default_font",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies.bevy]
workspace = true
default-features = false
features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_gilrs",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "png",
    "hdr",
    "ktx2",
    "zstd",
    "vorbis",
    "x11",
    "filesystem_watcher",
    "bevy_gizmos",
    "android_shared_stdcxx",
    "tonemapping_luts",
    "default_font",
    # TODO: This line is the only difference from default. Is there a way to
    #       deduplicate the feature list?
    "dynamic_linking",
]

# FIXME: Profiles for the non-root package are ignored, but [target] keys are
# not allowed in the root package >_<
# [target.'cfg(target_family = "wasm")'.profile.release]
# opt-level = "z"
