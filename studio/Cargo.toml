[package]
name = "studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "studio-standalone"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
bevy_rapier3d = { version = "0.22.0" }
console_error_panic_hook = { version = "0.1.7", optional = true }
bitflags = "2.4.0"
parking_lot = "0.12.1"
wasm-bindgen = { version = "0.2.84" }

[features]
wasm = [
	"dep:console_error_panic_hook",
	"bevy_rapier3d/wasm-bindgen",
]
