[package]
name = "studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "studio-standalone"
path = "src/main.rs"

[dependencies]
bevy-inspector-egui = "0.22.0"
bevy_mod_raycast = "0.16.0"
bevy_rapier3d = "0.23.0"
bevy_mod_outline = "0.6.0"
bevy_web_asset = "0.7.0"
bitflags = "2.4.0"
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3.65", optional = true }
parking_lot = "0.12.1"
serde = { version = "1.0.192", optional = true, features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.1", optional = true }
serde_json = { version = "1.0.108", optional = true }
studio-bvh = { path = "../studio-bvh" }
wasm-bindgen = "0.2.84"
web-sys = { version = "0.3.65", optional = true, features = [
	"CustomEvent",
	"CustomEventInit",
	"Document",
	"HtmlElement",
	"Window",
	"Element",
	"Node",
	"NodeList"
] }
space_editor = {git = "https://github.com/rewin123/space_editor", rev = "ce83f86dc902787ab16213f3209276a784654df6"}
anyhow.workspace = true
pretty-type-name = "1.0.1"
async-channel = "2.2.0"
uuid = { version = "1.3.0", features = ["v4"] }

[features]
wasm = [
	"dep:console_error_panic_hook",
	"dep:js-sys",
	"dep:serde",
	"dep:serde_json",
	"dep:serde-wasm-bindgen",
	"dep:web-sys",
	"bevy_rapier3d/wasm-bindgen",
]
desktop = []

[dependencies.bevy]
workspace = true

[dependencies.bevy_mod_picking]
version = "0.17.0"
default-features = false
features = [
	"backend_bevy_ui",
	"backend_rapier",
	"backend_raycast",
	"backend_sprite",
	"debug",
	"selection",
]
