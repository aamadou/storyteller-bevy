[package]
name = "studio"
version = "0.1.0"
edition = "2021"

[lib]
name = "studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "studio-standalone"
path = "src/main.rs"

[dependencies]
wasm-bindgen = { version = "0.2.84" }
console_error_panic_hook = { version = "0.1.7", optional = true }
parking_lot = "0.12.1"

[features]
wasm = ["dep:console_error_panic_hook"]

[dependencies.bevy]
workspace = true
